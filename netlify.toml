[build]
  base = "astro/"
  publish = "dist/"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # 多语言站点构建（9 语言 × 51 核心页 + 博客）堆内存需求高，
  # 默认 ~2GB 上限会导致 V8 OOM（FATAL ERROR: Ineffective mark-compacts near heap limit）；
  # 4096 在部分套餐上仍 OOM，已提高到 8192（注意需套餐内存上限 ≥ 8GB）
  NODE_OPTIONS = "--max-old-space-size=8192"

# 禁用 Netlify 全部后处理（含 Subfont 字体子集化）——构建超时的元凶：
# Subfont 每次部署扫描 dist 中的字体/图片，但期望 dist/.netlify/images 而实际目录是
# dist/images/，路径不匹配产生大量 ENOENT，最终拖垮构建。
# Astro 生产构建已自带 JS/CSS minify + 资源 hash，图片多为 webp，无需 Netlify 二次处理。
[build.processing]
  skip_processing = true

[images]
  remote_images = [
    "https://images\\.pexels\\.com/.*",
    "https://simpleanalyticsbadges\\.com/.*",
  ]

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# /en/* 301 跳转到无前缀版本（兼容旧链接）
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true

# SSR fallback（不加 force，现有静态文件由 CDN 直接提供）
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
