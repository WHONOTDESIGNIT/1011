# 注意：本文件含 [build].ignore —— ops/ 与文档类改动不会触发站点构建。
# 改 ignore 逻辑时务必确认"退出 0 = 跳过构建"这个语义，写反会导致漏部署。
[build]
  base = "astro/"
  publish = "dist/"
  # 构建命令统一为 npm run build —— 完整链（astro build + flatten-html + 校验 + IndexNow）
  # 定义在 astro/package.json 的 build script 中，避免 Netlify 控制台 Build command 覆盖
  # netlify.toml 的 command 时丢失 flatten/校验步骤（线上曾因此回退为目录型产物）。
  # flatten-html.mjs：方案B —— directory 产物（foo/index.html）→ .html + 生成 _redirects
  # （无尾斜杠 URL rewrite 到 .html、尾斜杠 301 到无尾斜杠，全站无结尾斜杠，Panasonic 风格）
  # 【已移除 2026-08-21】临时验证命令（ls/cat dist/_redirects）——线上三端点已确认
  # 生效（/zzz-notexist→404、/en/about→301→/about、/de→200），恢复正常 build 命令。
  # 在 build 前再跑一次 npm install：Netlify 的 install 阶段曾出现"缓存复用旧
  # node_modules、不装新声明依赖"的情况（js-yaml 因此 ERR_MODULE_NOT_FOUND）。
  # 已装齐时这次 install 是秒级 no-op，不影响后续 flatten/校验/IndexNow 链路。
  command = "npm install --no-audit --no-fund && npm run build"
  # ops-only / 文档类改动不重建站点。
  #
  # 起因：运维脚本（收录核验、提交、日报）曾放在本仓库 ops/ 下，与站点同分支。
  # 每次 push 到 main 都会触发一次 Netlify 生产部署，于是"改一行运维脚本注释"
  # 也要重建整站；部署记录里也分不清某次部署到底改了站点还是只改了工具。
  #
  # 语义：**ignore 退出 0 = 跳过构建**，非 0 = 构建。
  #   git diff --quiet 在"无差异"时返回 0 → 跳过；有差异返回 1 → 构建。
  #
  # 安全兜底：$CACHED_COMMIT_REF 为空（首次构建、缓存被清）时直接 exit 1 强制构建。
  # 少建一次的代价是站点陈旧，多建一次的代价只是几分钟 —— 所以宁可多建。
  #
  # 【2026-10-21 修复 · 内容改动被静默跳过】ignore 是在 **base 目录（astro/）** 里执行的，
  # 不是仓库根。原写法 `git diff --quiet … -- astro messages netlify.toml` 从 astro/ 看过去，
  # `astro` 变成 astro/astro（不存在）、`netlify.toml` 变成 astro/netlify.toml（不存在），
  # 只有 `messages` 侥幸命中 astro/messages —— 于是**只有改语言包时才会构建**，
  # 改 astro/src、astro/public 的提交一律被判定"无内容变化"而跳过（部署记录里显示为
  # error: Canceled build due to no content change）。
  # 证据：09059d8→ee8f163 改了 astro/scripts，从仓库根退出 1，从 astro/ 退出 0，Netlify 跳过了。
  # 修法：先定位仓库根，再用 -C 在根上做比较，pathspec 因此与 cwd 无关。
  ignore = "bash -c 'if [ -z \"$CACHED_COMMIT_REF\" ] || [ -z \"$COMMIT_REF\" ]; then exit 1; fi; root=$(git rev-parse --show-toplevel); git -C \"$root\" diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- astro netlify.toml'"

[build.environment]
  NODE_VERSION = "20"
  # 多语言站点构建（9 语言 × 51 核心页 + 博客）堆内存需求高，
  # 默认 ~2GB 上限会导致 V8 OOM（FATAL ERROR: Ineffective mark-compacts near heap limit）；
  # 4096 在部分套餐上仍 OOM，已提高到 8192（注意需套餐内存上限 ≥ 8GB）
  NODE_OPTIONS = "--max-old-space-size=8192"

# 禁用 Netlify 全部后处理（含 Subfont 字体子集化）——构建超时的元凶：
# Subfont 每次部署扫描 dist 中的字体/图片，但期望 dist/.netlify/images 而实际目录是
# dist/images/，路径不匹配产生大量 ENOENT，最终拖垮构建。
# Astro 生产构建已自带 JS/CSS minify + 资源 hash，图片多为 webp，无需 Netlify 二次处理。
[build.processing]
  skip_processing = true

[images]
  remote_images = [
    "https://images\\.pexels\\.com/.*",
    "https://simpleanalyticsbadges\\.com/.*",
  ]

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 存量图片（public/images/ 下的静态文件）：2026-10-24 线上实测响应头是
# `Cache-Control: public,max-age=0,must-revalidate` —— 每次进站都要重新验证一遍。
# 首页一处就有 247KB 走这个路径（logo、客户见证、产品图），回头客每次都得多问一次服务器。
# 这里补 30 天 + stale-while-revalidate：30 天内直接命中本地缓存，过期后先给旧的、后台再验证。
# 不写 immutable：这些文件路径不带 hash，原地换图是真实存在的操作，锁一年会长期看到旧图。
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    # CDN TTL, not browser TTL. With max-age=0 the edge cached nothing, Age stayed 0 on
    # every request and each visitor paid origin latency (TTFB 740-1100 ms in traces).
    # Netlify purges on deploy, so an hour is safe; the browser still revalidates.
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

# 全站存量图片（public/images/ 下静态文件）：**直接由静态资源服务**，不再重写进 Image CDN。
#
# 【2026-09-19 修复 · 图片全站 504/508】
# 此前有两条 force=true 的重写把 /images/* 送进 Image CDN：
#   /images/*                     → /.netlify/images?url=/images/:splat
#   /images/blog/ipl-long-pass-…  → /.netlify/images?url=/images/blog/ipl-long-pass-…&w=413
# CDN 拿到请求后需要回头取同站源图 /images/…，而该路径又被同一条 force 规则重写回 CDN，
# 形成自指回环：直连 .webp 与 /.netlify/images?... 请求同时失败（实测 504/508，`/images/` 连接被断），
# 而 /robots.txt 等非 /images/ 静态资源正常 200 —— 证明故障范围就是这两条规则。
#
# 静态图片本身已带长缓存（见下方 /images/* 的 Cache-Control: immutable），
# 那条 w=413 的规则服务的三张图原图仅 27.7 / 30.3 / 53.4 KB，收益远小于代价，故一并删除。
# 需要 CDN 变体时，由 HTML 直接请求 /.netlify/images?url=…（本站 srcset 已是该形式），
# 由于不再有 /images/* 重写，CDN 取源图走静态资源，不再回环。

# /en/* 301 跳转到无前缀版本（兼容旧链接）
#
# ⚠ 2026-10-22：本条与下面那条 /* → /404.html **当前都不会被触发**。
#   Netlify 的规则处理顺序是「先 _redirects，后 netlify.toml」，且命中第一条即停止；
#   astro/scripts/flatten-html.mjs 每次构建都会把等价的两条写进 dist/_redirects
#   （`/en/* /:splat 301!` 与 `/* /404.html 404`），所以这里只剩兜底作用：
#   仅当 _redirects 缺失时才生效。要改这两条的行为，改生成器，不要改这里。
#   已核对：两处字段完全一致（from/to/status/force），两边都不含 query、
#   conditions、headers、signed，因此不存在隐藏的语义差异。
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true

# 兜底 404：未匹配任何静态文件的路径返回 404（软 404 修复——
# 此前 `/* → SSR 200` 使任意不存在的 URL 都返回 200，易被搜索引擎判为低质信号）
# 【2026-08-21 修复】不加 force：Netlify shadowing 默认"有文件优先于重定向"，
# force=true 反而让 catch-all 无视 index.html，首页 / 直接 404（Lighthouse 证实）。
# 去掉后：有文件的路径（含 /）正常返回 200，无文件路径落入本规则返回 404。
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# 安全响应头（安全排查 R5）：HSTS 由 Netlify 默认提供，这里补齐基线项。
# X-Frame-Options 仍未设置：会挡住站内浏览器预览，等 CSP 报告观察清楚谁在嵌入后再定。
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # CSP 第一步：Report-Only（只报告、不拦截），按 Netlify 官方建议的路线走
    # （docs.netlify.com/manage/security/content-security-policy/）：先观察违规，再决定是否强制。
    #
    # 策略不是文档里那份通用样板（default-src 'none'; script-src 'self'; …），而是按**本站实际加载的资源**
    # 实测后写的（2026-09-14 逐页扫过 script/style/img/font/iframe 的来源，6 个代表页）：
    #   · script：本站 + googletagmanager.com（GA4）+ scripts.simpleanalyticscdn.com（Simple Analytics）
    #             + analytics.ahrefs.com（Ahrefs Web Analytics，2026-09-22 安装）
    #   · img：本站 + flagcdn.com（语言旗标）+ coresg-normal.trae.ai（早期 AI 生成配图）
    #          + images.pexels.com（2026-09-22 补：实测 618 个页面仍有 pexels 直链 <img src>，
    #            另 264 个页面走 Netlify Image CDN 代理；直链属 img-src 管辖，缺白名单会持续产生违规报告）
    #   · font：fonts.gstatic.com；无外部 stylesheet；无 iframe/video
    #   · connect：GA4 与 Simple Analytics 的运行时上报端点（静态 HTML 里看不到，按运行时需要补）
    #              + analytics.ahrefs.com（同域承载脚本与上报，官方片段只有这一个域）
    # 若直接用通用样板，报告会被"我们本来就在用"的资源淹没，真正的异常反而看不见。
    #
    # 内联为何仍留 'unsafe-inline'：实测这些页面共有 81 个内联 <script>、19 个内联 <style>、
    # 82 个 on*= 事件属性、131 个 style= 属性，CSP 下只有 'unsafe-inline' 或逐个 hash/nonce 两条路。
    # 想走到强制模式，需先给内联脚本/样式生成 hash（Astro 5.9+ 的 experimental.csp 可自动产出）
    # 并清掉 on*= 属性 —— 那是独立一轮改造，不宜和这一步混做。
    #
    # frame-ancestors 先设 'self'：报告阶段用来**观察**谁在嵌入本站（应用内浏览器预览就是一种嵌入），
    # Report-Only 不会挡住任何嵌入。
    #
    # 【2026-10-20 增】Microsoft Clarity（Analytics.astro，项目 yymyby2wbc）。
    # 官方要求的完整集合：script-src 放行 https://*.clarity.ms（www 是标签脚本，a..z 是生产环境
    # 负载均衡域名，写死 www 会漏），connect-src 放行上报端点，img-src 放行 https://c.bing.com
    # （Clarity 与 Bing 共用的采集域名，也是无 JS 时的像素兜底）。
    # 依据：learn.microsoft.com/clarity/setup-and-installation/clarity-csp ——
    # "If you need to add all individual Clarity domains to your CSP, you can add
    #  https://www.clarity.ms, https://c.bing.com, and https://[a-z].clarity.ms"。
    # 注意这只是 Report-Only：漏加不会阻断，只会持续刷违规报告，等到切强制模式时才变成真故障。
    Content-Security-Policy-Report-Only = "default-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://scripts.simpleanalyticscdn.com https://analytics.ahrefs.com https://*.clarity.ms https://c.bing.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://flagcdn.com https://coresg-normal.trae.ai https://images.pexels.com https://*.clarity.ms https://c.bing.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://queue.simpleanalyticscdn.com https://analytics.ahrefs.com https://*.clarity.ms https://c.bing.com; media-src 'self'; worker-src 'self'; manifest-src 'self'"
