[build]
  base = "astro/"
  publish = "dist/"
  # 构建后运行 AI 爬虫授权守护脚本：GPTBot/ClaudeBot/PerplexityBot 若被误拦截将中止部署（fail-safe）
  # check-llms.mjs：校验 llms.txt 无 /en/ 前缀、无尾斜杠、无死链（防回归）
  # flatten-html.mjs：方案B —— 将 directory 产物（foo/index.html）转换为 .html 文件，
  # 使 Netlify 原生将 /about/ 301 → /about（全站无结尾斜杠，Panasonic 风格）
  command = "npm run build && node scripts/flatten-html.mjs && node scripts/check-robots.mjs && node scripts/check-llms.mjs && node scripts/submit-indexnow.mjs"

[build.environment]
  NODE_VERSION = "20"
  # 多语言站点构建（9 语言 × 51 核心页 + 博客）堆内存需求高，
  # 默认 ~2GB 上限会导致 V8 OOM（FATAL ERROR: Ineffective mark-compacts near heap limit）；
  # 4096 在部分套餐上仍 OOM，已提高到 8192（注意需套餐内存上限 ≥ 8GB）
  NODE_OPTIONS = "--max-old-space-size=8192"

# 禁用 Netlify 全部后处理（含 Subfont 字体子集化）——构建超时的元凶：
# Subfont 每次部署扫描 dist 中的字体/图片，但期望 dist/.netlify/images 而实际目录是
# dist/images/，路径不匹配产生大量 ENOENT，最终拖垮构建。
# Astro 生产构建已自带 JS/CSS minify + 资源 hash，图片多为 webp，无需 Netlify 二次处理。
[build.processing]
  skip_processing = true

[images]
  remote_images = [
    "https://images\\.pexels\\.com/.*",
    "https://simpleanalyticsbadges\\.com/.*",
  ]

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# /en/* 301 跳转到无前缀版本（兼容旧链接）
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true

# 兜底 404：未匹配任何静态文件的路径返回 404（软 404 修复——
# 此前 `/* → SSR 200` 使任意不存在的 URL 都返回 200，易被搜索引擎判为低质信号）
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
