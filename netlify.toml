[build]
  base = "astro/"
  publish = "dist/"
  # 构建命令统一为 npm run build —— 完整链（astro build + flatten-html + 校验 + IndexNow）
  # 定义在 astro/package.json 的 build script 中，避免 Netlify 控制台 Build command 覆盖
  # netlify.toml 的 command 时丢失 flatten/校验步骤（线上曾因此回退为目录型产物）。
  # flatten-html.mjs：方案B —— directory 产物（foo/index.html）→ .html + 生成 _redirects
  # （无尾斜杠 URL rewrite 到 .html、尾斜杠 301 到无尾斜杠，全站无结尾斜杠，Panasonic 风格）
  # 【已移除 2026-08-21】临时验证命令（ls/cat dist/_redirects）——线上三端点已确认
  # 生效（/zzz-notexist→404、/en/about→301→/about、/de→200），恢复正常 build 命令。
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # 多语言站点构建（9 语言 × 51 核心页 + 博客）堆内存需求高，
  # 默认 ~2GB 上限会导致 V8 OOM（FATAL ERROR: Ineffective mark-compacts near heap limit）；
  # 4096 在部分套餐上仍 OOM，已提高到 8192（注意需套餐内存上限 ≥ 8GB）
  NODE_OPTIONS = "--max-old-space-size=8192"

# 禁用 Netlify 全部后处理（含 Subfont 字体子集化）——构建超时的元凶：
# Subfont 每次部署扫描 dist 中的字体/图片，但期望 dist/.netlify/images 而实际目录是
# dist/images/，路径不匹配产生大量 ENOENT，最终拖垮构建。
# Astro 生产构建已自带 JS/CSS minify + 资源 hash，图片多为 webp，无需 Netlify 二次处理。
[build.processing]
  skip_processing = true

[images]
  remote_images = [
    "https://images\\.pexels\\.com/.*",
    "https://simpleanalyticsbadges\\.com/.*",
  ]

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# 全站存量图片（public/images/ 下静态文件）接入 Netlify Image CDN：
# 边缘重写 /.netlify/images?url=<同站路径>，自动内容协商（AVIF/WebP）+ 按需压缩 + 边缘缓存。
# force=true 必须：Netlify shadowing 默认"存在文件优先于重定向"，不加 force 时静态文件
# 会绕过重写直接返回原图，重写规则形同虚设。加 force 后所有 /images/* 请求统一走 CDN。
# 注：images 目录已被 flatten-html.mjs 白名单排除（不会命中页面通配规则），
# 且 /images/* 比 _redirects 兜底 /* 404 更具体，规则优先级无冲突。
# 2026-08-26 实测 /.netlify/images?url=/images/... 本地图可正常缩放（200）。
# 针对 47-ipl-long-pass-filter-test-report 正文中的 3 张图，单独收敛到正文固定展示宽度，
# 这样 22 个多语言 MDX 都无需逐个改写 markdown。
[[redirects]]
  from = "/images/blog/ipl-long-pass-filter-test-report-*"
  to = "/.netlify/images?url=/images/blog/ipl-long-pass-filter-test-report-:splat&w=413&q=80"
  status = 200
  force = true

[[redirects]]
  from = "/images/*"
  to = "/.netlify/images?url=/images/:splat"
  status = 200
  force = true

# /en/* 301 跳转到无前缀版本（兼容旧链接）
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true

# 兜底 404：未匹配任何静态文件的路径返回 404（软 404 修复——
# 此前 `/* → SSR 200` 使任意不存在的 URL 都返回 200，易被搜索引擎判为低质信号）
# 【2026-08-21 修复】不加 force：Netlify shadowing 默认"有文件优先于重定向"，
# force=true 反而让 catch-all 无视 index.html，首页 / 直接 404（Lighthouse 证实）。
# 去掉后：有文件的路径（含 /）正常返回 200，无文件路径落入本规则返回 404。
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
